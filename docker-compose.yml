services:
  db:
    image: postgres:16
    container_name: oc-p4-datashare-postgres
    environment:
      POSTGRES_DB: datashare
      POSTGRES_USER: datashare
      POSTGRES_PASSWORD: datashare
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      - datashare_pg:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oc-p4-datashare-api
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=datashare;Username=datashare;Password=datashare"
      Jwt__Key: "change-me-in-production-secret-key-32chars"
      Jwt__Issuer: "DataShareApi"
      Jwt__Audience: "DataShareClient"
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oc-p4-datashare-frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  datashare_pg:
