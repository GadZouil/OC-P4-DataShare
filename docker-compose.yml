services:
  db:
    image: postgres:16
    container_name: oc-p4-datashare-postgres
    environment:
      POSTGRES_DB: datashare
      POSTGRES_USER: datashare
      POSTGRES_PASSWORD: datashare
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    ports:
      - "5433:5432"
    volumes:
      - datashare_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashare -d datashare"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oc-p4-datashare-api
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=datashare;Username=datashare;Password=datashare"
      Jwt__Key: "change-me-in-production-secret-key-32chars"
      Jwt__Issuer: "DataShareApi"
      Jwt__Audience: "DataShareClient"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/auth/login || true"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: oc-p4-datashare-frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  datashare_pg:
